<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trade Republic API — Documentation</title>
    <meta name="theme-color" content="#0b0b0d" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      @font-face { font-family: 'TR Sans Display'; font-weight: 500; font-display: swap; src: url('/fonts/TradeRepublicSans-Display-500.woff2') format('woff2'); }
      @font-face { font-family: 'TR Sans Display'; font-weight: 580; font-display: swap; src: url('/fonts/TradeRepublicSans-Display-580.woff2') format('woff2'); }
      @font-face { font-family: 'TR Sans Display'; font-weight: 680; font-display: swap; src: url('/fonts/TradeRepublicSans-Display-680.woff2') format('woff2'); }
      @font-face { font-family: 'TR Sans Display'; font-weight: 740; font-display: swap; src: url('/fonts/TradeRepublicSans-Display-740.woff2') format('woff2'); }

      :root {
        --bg: #0b0b0d; --panel: #141518; --sunken: #08090b;
        --text: #f4f5f7; --muted: #a6acb8; --muted-2: #7f8593;
        --line: #23262d; --line-2: #2c3038;
        --red: #ff4034; --red-ink: #ff5a4f;
        --sans: 'TR Sans Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --mono: 'SFMono-Regular', ui-monospace, 'SF Mono', Menlo, 'Cascadia Code', monospace;
      }
      * { box-sizing: border-box; }
      html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: var(--sans); font-weight: 500; font-size: 16.5px; line-height: 1.7; letter-spacing: -0.011em;
        background-image: radial-gradient(900px 480px at 50% -160px, rgba(255, 64, 52, 0.10), transparent 62%);
        background-repeat: no-repeat;
      }
      ::selection { background: var(--red); color: #fff; }
      :focus-visible { outline: 2px solid var(--red-ink); outline-offset: 3px; border-radius: 4px; }

      .topbar {
        position: sticky; top: 0; z-index: 10; display: flex; gap: 18px; align-items: center;
        padding: 13px 22px; background: rgba(11, 11, 13, 0.72); backdrop-filter: blur(14px) saturate(180%);
        -webkit-backdrop-filter: blur(14px) saturate(180%); border-bottom: 1px solid var(--line);
        font-size: 14px; font-weight: 580;
      }
      .topbar .brand { display: flex; align-items: center; gap: 9px; font-weight: 680; letter-spacing: -0.03em; color: var(--text); margin-right: 4px; }
      .topbar .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: #000; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09); }
      .topbar .brand .mark::before { content: ''; width: 8px; height: 8px; border-radius: 2px; background: var(--red); box-shadow: 0 0 10px rgba(255,64,52,0.8); }
      .topbar a:not(.brand) { color: var(--muted); text-decoration: none; transition: color 0.2s; }
      .topbar a:not(.brand):hover { color: var(--text); }
      .topbar .spacer { flex: 1; }
      .topbar .ext { color: var(--muted-2); }

      .wrap { max-width: 820px; margin: 0 auto; padding: 44px 24px 120px; }

      h1, h2, h3, h4 { font-family: var(--sans); font-weight: 740; letter-spacing: -0.035em; line-height: 1.12; text-wrap: balance; }
      h1 { font-size: clamp(2rem, 4vw, 2.7rem); margin: 8px 0 20px; }
      h2 { font-size: 1.6rem; margin: 52px 0 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
      h3 { font-size: 1.22rem; margin: 34px 0 4px; }
      h4 { font-size: 1.05rem; margin: 26px 0 4px; }
      p { margin: 14px 0; color: #e4e7ec; text-wrap: pretty; }
      a { color: var(--red-ink); text-decoration: none; }
      a:hover { text-decoration: underline; text-underline-offset: 3px; }
      strong { font-weight: 680; color: var(--text); }
      ul, ol { padding-left: 22px; }
      li { margin: 7px 0; color: #e4e7ec; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }

      code { font-family: var(--mono); font-size: 0.86em; background: var(--sunken); padding: 2px 6px; border-radius: 6px; color: #ffd7d2; border: 1px solid var(--line); }
      pre { background: var(--sunken); border: 1px solid var(--line-2); border-radius: 14px; padding: 18px 20px; overflow: auto; line-height: 1.6; box-shadow: 0 20px 50px -30px rgba(0,0,0,0.8); }
      pre code { background: none; padding: 0; border: 0; color: #e7eaf0; font-size: 13.5px; }

      table { border-collapse: collapse; width: 100%; margin: 18px 0; font-size: 14.5px; }
      th, td { border: 1px solid var(--line); padding: 9px 12px; text-align: left; vertical-align: top; }
      th { background: var(--panel); font-weight: 680; color: var(--text); }
      td { color: var(--muted); }

      blockquote {
        margin: 20px 0; padding: 14px 18px; color: var(--muted);
        background: rgba(255, 64, 52, 0.05); border: 1px solid var(--line-2); border-radius: 12px;
      }
      blockquote p { margin: 4px 0; color: var(--muted); }

      .loading { color: var(--muted-2); }
      img { max-width: 100%; border-radius: 12px; border: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="brand" href="/"><span class="mark"></span> Trade Republic</a>
      <a href="/">Home</a>
      <a href="/api.html">API reference</a>
      <span class="spacer"></span>
      <a class="ext" href="https://github.com/pytr-org/pytr" target="_blank" rel="noopener">pytr ↗</a>
    </div>
    <div class="wrap">
      <div id="doc" class="loading">Loading documentation…</div>
    </div>
    <script>
      fetch('/docs.md')
        .then((r) => (r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status))))
        .then((md) => {
          document.getElementById('doc').className = '';
          document.getElementById('doc').innerHTML = marked.parse(md);
        })
        .catch((e) => {
          document.getElementById('doc').textContent =
            'Could not load /docs.md (' + e.message + '). Serve via the website server.';
        });
    </script>
  </body>
</html>
